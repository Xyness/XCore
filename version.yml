# Version
version: 1.0.7

# Update date
date: 16/08/2026

# Update notes
update-notes:
- "Renamed /coins to /eco, the old name stays as an alias"
- "Added a single language setting, XCore and every addon follow it (en and fr bundled)"
- "Moved lang.yml and economy-lang.yml to lang/en.yml and lang/fr.yml"
- "Added lang/web_en.yml and lang/web_fr.yml for the dashboard labels"
- "Added migrate-uuid-changes, a returning player keeps their row when their UUID changes"
- "Added /xcore profile, time spent per addon and per event handler"
- "Added /xcore diag, a full support report written to plugins/XCore/"
- "Added a tick thread watchdog, with debug: true a database call from a tick thread is named"
- "Added /xcore dashboard, a one click login link, and /xcore dashboard revoke to close the sessions"
- "Redesigned the web dashboard"
- "Addons declare their own dashboard pages and routes (WebPageSpec)"
- "Added BlinkCache, a blinking GUI item is built once per face instead of twice a second"
- "Added WorldConfig, worlds.<name>.<key> overrides are resolved once at load"
- "Added Formats for durations, numbers, sizes and compact values"
- "Balance changes are applied atomically in the database and serialized per player"
- "Added currency exchange, scheduled payouts and interest"
- "Added per-server balances (per-server-balances)"
- "Vault stays optional, the economy runs without it"
- "The query builder handles joins, whereIn, relative updates and batch inserts"
- "MiniMessage parsing is cached, a lore is no longer rebuilt on every draw"
- "The updater only announces a version newer than the installed one"
- "paper-plugin.yml takes its version from the build instead of a hardcoded one"
