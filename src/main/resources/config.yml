# XCore Configuration

# Enable debug logging (verbose cache/database/API messages).
# It also turns on the tick-thread watchdog: any addon querying the database from a tick thread is
# named in the console, once per call site.
debug: false

# Measure how long each addon spends in each event handler, readable with /xcore profile.
# Addons run under XCore's plugin identity, so a timings report blames XCore for all of them —
# this is what tells you which addon is actually costing tick time.
# Costs one boolean read per event when off; leave it off unless you are investigating.
profiling: false

# Language for XCore AND every addon, so the choice is made once instead of in a dozen files.
# Bundled: en, fr. Files live in plugins/XCore/lang/ and plugins/XCore/addons/<addon>/lang/ —
# edit them freely, they are never overwritten.
# An addon can override this with its own `language` key; without one it follows this.
# An addon that ships no translation for the chosen language falls back to English.
# Console logs stay in English.
language: "en"

# Database type: sqlite, mysql, postgresql
database-type: sqlite

# Server name
server-name: "default"

# Recognise a returning player whose UUID changed.
# server_uuid is derived from the name in offline mode and comes from Mojang in online mode, so
# switching that setting — or moving the server behind a proxy that changes it — makes every player
# look brand new. With this on, their existing row is moved onto the new UUID instead of a second
# one being created: balances, per-addon columns and history follow them.
# Matching is by Mojang UUID first, and by name only for accounts that have no Mojang UUID at all.
migrate-uuid-changes: true

# MySQL / PostgreSQL settings (ignored for sqlite)
database:
  host: localhost
  port: 3306
  name: xcore
  username: root
  password: ""
  ssl: false
  pool-size: 10

# Cross-server (multi-server network)
# Requires MySQL or PostgreSQL (not compatible with SQLite).
cross-server:
  enabled: false

  # Redis (optional, used for L2 cache and Pub/Sub sync)
  # If disabled, sync falls back to database polling.
  redis:
    enabled: false
    host: localhost
    port: 6379
    password: ""
    database: 0
    # TTL in seconds for cached player data
    ttl: 3600

  # How often each server announces itself to the others. That is what feeds the server list,
  # "which server is this player on", and messages addressed to one server in particular.
  heartbeat-seconds: 10

  # Sync settings
  sync:
    # Poll interval in seconds (fallback if Redis unavailable)
    poll-interval-seconds: 3
    # How long to keep invalidation entries before cleanup (in seconds)
    retention-seconds: 300


# Cache settings
cache:
  # Maximum number of player entries in the L1 cache
  max-size: 100000
  # Time-to-live in minutes for player cache entries
  ttl-minutes: 60
  # Maximum number of entries in the Mojang UUID/skin cache
  mojang-max-size: 5000
  # Maximum concurrent Mojang API requests
  max-api-concurrency: 10
  # Timeout in milliseconds for Mojang API HTTP connections
  api-timeout-ms: 2000
  # Circuit breaker: number of consecutive Mojang API failures before disabling calls
  circuit-breaker-threshold: 5
  # Circuit breaker: minutes to wait before retrying after opening
  circuit-breaker-open-minutes: 5

# Web dashboard
web-dashboard:
  enabled: true
  port: 8085
  # How long a link from /xcore dashboard stays valid, in hours. 0 = until the token is revoked.
  session-ttl-hours: 24
  # Whether the /api/metrics endpoint is publicly accessible (no auth required)
  metrics-public: true
  # Allowed browser origin for the API. Keep "*" only if the dashboard is not
  # reachable from the internet; otherwise set your panel URL (e.g. https://panel.example.com)
  cors-origin: "*"
  # Address /xcore dashboard links to. Leave empty to build it from the server address and the
  # port above; set it when a reverse proxy or a domain sits in front (e.g. https://panel.example.com)
  public-url: ""

# /plugins does not know about the addons: they are loaded by XCore, not by the server. With this
# on, the command answers with a third section listing them. /bukkit:plugins still gives the
# server's own list.
plugins-command:
  override: true

# Deliveries: what an addon owes a player but could not hand over — a reward when the inventory was
# full, a payment for somebody offline. Any addon can use it; nothing is ever lost in the meantime.
delivery:
  # Hand everything over when the player joins.
  on-join: true
  # How many to hand over per join, so a long backlog does not slow a login down.
  per-join-limit: 20

# Shared integrations
integrations:
  discord:
    # The name and picture messages are posted under, when the addon does not set its own.
    # Each addon keeps its own webhook address in its own config; only the identity is shared.
    username: "XCore"
    avatar-url: ""

# Economy system (built-in, requires Vault)
# Automatically enabled if Vault is installed, disabled otherwise.
economy:
  enabled: true

  # Cross-server support (per-server balances)
  # Uses the server-name above for isolation
  per-server-balances: false

  # Define currencies
  currencies:
    dollar:
      symbol: "$"
      symbol-position: BEFORE
      decimals: 2
      starting-balance: 0.00
      max-balance: 1000000000
      vault: true

  # Currency exchange
  exchange:
    enabled: false
    rates: {}

  # Scheduled payouts
  scheduled-payouts:
    enabled: false
    interval-minutes: 60
    amount: 10.0
    currency: "dollar"

  # Interest on balances
  interest:
    enabled: false
    rate: 0.01
    interval-minutes: 1440
    currency: "dollar"
