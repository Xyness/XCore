  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">

  <title>XCore</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1017'/%3E%3Cg fill='none' stroke='%23c8a45c' stroke-width='1.9' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M16 6.2 25 11.2v9.6L16 25.8 7 20.8v-9.6z'/%3E%3Cpath d='M7 11.2 16 16.2 25 11.2'/%3E%3Cpath d='M16 16.2V25.8'/%3E%3C/g%3E%3C/svg%3E">

  <!--
    Before anything is drawn: the theme, so the light one never flashes dark; the token of a
    /xcore dashboard link, taken out of the address bar at once so it does not sit in a history
    entry or a screenshot; and the first requests, started now rather than once the scripts have
    loaded — on a server reached across the internet that saves a round trip or two.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      var stored = null;
      try { stored = localStorage.getItem("xcore-theme"); } catch (e) {}
      var light = window.matchMedia("(prefers-color-scheme: light)");
      var apply = function () {
        root.setAttribute("data-theme", stored === "light" || stored === "dark" ? stored : light.matches ? "light" : "dark");
      };
      apply();
      if (light.addEventListener) light.addEventListener("change", function () {
        try { stored = localStorage.getItem("xcore-theme"); } catch (e) {}
        if (!stored) apply();
      });

      // Links carry the token in the fragment, which no server and no access log ever sees;
      // ?token= is still read, from links made by older versions.
      var token = "";
      var match = /[?&#]token=([^&#]+)/.exec(location.search + location.hash);
      if (match) {
        try { token = decodeURIComponent(match[1]); } catch (e) { token = match[1]; }
        try { localStorage.setItem("xcore_token", token); } catch (e) {}
        // A route after the token (?token=…#/players) is kept; a token in the fragment is the fragment.
        history.replaceState(null, "", location.pathname + (location.hash.indexOf("#/") === 0 ? location.hash : ""));
      }
      if (!token) try { token = localStorage.getItem("xcore_token") || ""; } catch (e) {}

      var early = {};
      var take = function (path, auth) {
        var request = fetch(path, auth ? { headers: { Authorization: "Bearer " + token } } : undefined);
        request.catch(function () {});
        early[path] = request;
      };
      take("/api/lang", false);
      if (token) {
        take("/api/auth", true);
        take("/api/modules", true);
        take("/api/metrics", true);
      }
      window.__xcore = { early: early, token: token };
    })();
  </script>
