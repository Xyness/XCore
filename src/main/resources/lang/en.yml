# ---------------------------------------------------------------------------

player-loading: "<gray>Looking up {name}…"
player-not-found: "<red>No player named {name} is known to this server."
player-header: " <aqua>{name} <white>· {status}"
player-server-uuid: " <yellow>▸ <white>Server UUID: <gray>{value}"
player-mojang-uuid: " <yellow>▸ <white>Mojang UUID: <gray>{value}"
player-texture: " <yellow>▸ <white>Texture: <gray>{value}"
player-last-login: " <yellow>▸ <white>Last login: <gray>{value}"
player-last-logout: " <yellow>▸ <white>Last logout: <gray>{value}"
player-data-header: " <gray>Custom data <yellow>({count})"
player-data-entry: " <yellow>› <white>{key}: <gray>{value}"

# ---------------------------------------------------------------------------
# Economy (/coins)
#
# These used to live in economy_<code>.yml. They are prefixed with eco- so a new
# core message can never quietly take one of them over.
# ---------------------------------------------------------------------------

player-only: "<red>This command can only be used by players."
eco-invalid-currency: "<red>Unknown currency {currency}. Available: {currencies}"
eco-insufficient-funds: "<red>Insufficient funds. You have {balance}."
error: "<red>An error occurred. Please try again."
eco-balance-capped: "<yellow>Balance was capped at {max} for {currency}."

eco-balance-title: "<aqua>Balances"
eco-balance-self-single: "<white>Your balance: <yellow>{balance} <gray>({currency})"
eco-balance-other-single: "<white>{name}'s balance: <yellow>{balance} <gray>({currency})"
eco-balance-entry: "  <yellow>{balance} <gray>({currency})"
eco-balance-end: ""

eco-pay-sent: "<green>Sent <yellow>{amount} <gray>({currency}) <green>to {target}."
eco-pay-received: "<green>Received <yellow>{amount} <gray>({currency}) <green>from {sender}."
eco-pay-self: "<red>You cannot pay yourself."

eco-set-success: "<green>Set {name}'s <gray>({currency}) <green>balance to <yellow>{amount}<green>."
eco-add-success: "<green>Added <yellow>{amount} <gray>({currency}) <green>to {name}. New: <yellow>{balance}<green>."
eco-remove-success: "<green>Removed <yellow>{amount} <gray>({currency}) <green>from {name}. New: <yellow>{balance}<green>."
eco-reset-success: "<green>Reset {name}'s <gray>({currency}) <green>balance to <yellow>{amount}<green>."

eco-resetall-warning: "<red>This will reset EVERY player (online and offline) for: {currency}. This cannot be undone."
eco-resetall-confirm-usage: "<red>Type <gray>/eco resetall {currency} confirm <red>to proceed."
eco-resetall-started: "<gray>Resetting all balances for {currency}..."
eco-resetall-success: "<green>Reset {count} <green>player balance(s) for {currency}."

eco-exchange-success: "<green>Exchanged <yellow>{from_amount} <gray>({from_currency}) <green>for <yellow>{to_amount} <gray>({to_currency})<green>."
eco-exchange-no-rate: "<red>No exchange rate available for this currency pair."
eco-exchange-disabled: "<red>Currency exchange is currently disabled."

eco-history-title: "<aqua>{name}'s history <gray>(Page {page}/{max_page})"
eco-history-entry: "  <gray>{date} <gray>| <green>{type} <gray>| <yellow>{amount} <gray>{currency} <gray>| <white>{target}"
eco-history-empty: "  <gray>No transactions found."
eco-history-end: ""

eco-top-title: "<aqua>{currency} top"
eco-top-entry: "  <white>#{rank} <gray>- <gold>{name} <gray>- <yellow>{balance}"
eco-top-empty: "  <gray>No data available."
eco-top-end: ""

eco-reload-success: "<green>Economy configuration reloaded."
eco-reload-warning-no-vault: "<yellow>No currency is marked <white>vault: true<yellow> — other plugins will not see any balance."

eco-payout-received: "<green>You received <yellow>{amount} <gray>({currency}) <green>as a scheduled payout."
eco-interest-received: "<green>You earned <yellow>{amount} <gray>({currency}) <green>in interest."

eco-help-message: |
  <aqua>Economy Help
  <gray>
  <yellow>/eco <white>- View all your balances
  <yellow>/eco balance [player] [currency] <white>- View balance
  <yellow>/eco pay <player> <amount> [currency] <white>- Send money
  <yellow>/eco set <player> <amount> [currency] <white>- Set balance (admin)
  <yellow>/eco add <player> <amount> [currency] <white>- Add balance (admin)
  <yellow>/eco remove <player> <amount> [currency] <white>- Remove balance (admin)
  <yellow>/eco reset <player> [currency|all] <white>- Reset a player to the starting balance (admin)
  <yellow>/eco resetall [currency|all] confirm <white>- Reset every player, online and offline (admin)
  <yellow>/eco exchange <from> <to> <amount> <white>- Exchange currencies
  <yellow>/eco history [player] [currency] [page] <white>- Transaction history
  <yellow>/eco top [currency] <white>- Top balances
  <yellow>/eco reload <white>- Reload config (admin)

# ---------------------------------------------------------------------------
# Addon update notice, sent in game to staff who may update the server.
# An addon can override it in its own language file.
# ---------------------------------------------------------------------------

update-available: "<dark_red>[{addon}] <red>An update is available: <underlined>{version}</underlined> ({date})"

# ---------------------------------------------------------------------------
# Deliveries: things handed over on join because they could not be given at
# the time — a reward with a full inventory, a payment made while offline.
# ---------------------------------------------------------------------------

delivery-received: " <yellow>▸ <white>You have received <gray>{count} <white>pending item(s)."

# ---------------------------------------------------------------------------
# /plugins, answered by XCore so its addons appear next to the server plugins.
# ---------------------------------------------------------------------------

