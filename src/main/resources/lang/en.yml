# XCore Language File
# Supports MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
# Placeholders: {key} will be replaced with the appropriate value.
#
# Layout note: the labels below are padded with spaces to line the columns up. Adjust the padding
# if you translate them to longer words.
#
# Careful with hover and click arguments: their text is wrapped in single quotes, so an apostrophe
# inside one would cut the line short. Write "Click to open", never "Click to open it's page".

no-permission: "<red>You don't have permission to use this command."

# Shared pieces
bar: "<white><strikethrough>                                                            </strikethrough>"
blank: ""
status-on: "<green>on"
status-off: "<red>off"
player-online: "<green>online"
player-offline: "<red>offline"
value-none: "<gray>none"

# Duration units, appended straight to the number: 2d 4h, 13m, 45s
unit-day: "d"
unit-hour: "h"
unit-minute: "m"
unit-second: "s"

# ---------------------------------------------------------------------------
# /xcore
# ---------------------------------------------------------------------------

info-header: " <aqua>XCore <yellow>v{version}"
info-subtitle: " <gray>Framework for the X ecosystem"

info-server: " <yellow>▸ <white>Server: <green>{name} <white>· <gray>{software}"
info-uptime: " <yellow>▸ <white>Uptime: <gray>{value} <white>· <green>{players}<white> online"
info-database: " <yellow>▸ <white>Database: <gray>{type} <white>· <gray>{reads} reads <white>· <gray>{writes} writes"
info-addons: " <yellow>▸ <white>Addons: <hover:show_text:'{list}'><gray>{enabled}/{total}</hover>"
info-addons-entry: "<aqua>{name} <yellow>v{version} <white>— {state}"
info-addons-none: "<gray>No addon installed"
info-sync: " <yellow>▸ <white>Sync: {status} <white>· <gray>{backend}"
sync-backend-redis: "Redis"
sync-backend-database: "DB polling"
info-dashboard: " <yellow>▸ <white>Dashboard: <click:open_url:'{url}'><hover:show_text:'<gray>Click to open'><aqua><underlined>{url}</underlined></aqua></hover></click>"
info-dashboard-off: " <yellow>▸ <white>Dashboard <red>off <white>· <gray>enable it in config.yml"

info-commands: " <gray>Commands"
cmd-stats: " <yellow>› <click:run_command:'/xcore stats'><hover:show_text:'<gray>Click to run'><white>/xcore stats</hover></click> <gray>— Cache and API counters"
cmd-addons: " <yellow>› <click:run_command:'/xcore addons'><hover:show_text:'<gray>Click to run'><white>/xcore addons</hover></click> <gray>— Addon versions and states"
cmd-player: " <yellow>› <click:suggest_command:'/xcore player '><hover:show_text:'<gray>Click to fill in'><white>/xcore player <name></hover></click> <gray>— Look up a player"
cmd-dashboard: " <yellow>› <click:run_command:'/xcore dashboard'><hover:show_text:'<gray>Click to run'><white>/xcore dashboard</hover></click> <gray>— Web dashboard access"
cmd-reload: " <yellow>› <click:suggest_command:'/xcore reload'><hover:show_text:'<gray>Click to fill in'><white>/xcore reload [addon]</hover></click> <gray>— Reload the core and the addons"
cmd-profile: " <yellow>› <click:run_command:'/xcore profile'><hover:show_text:'<gray>Click to run'><white>/xcore profile</hover></click> <gray>— Time spent per addon"
cmd-diag: " <yellow>› <click:run_command:'/xcore diag'><hover:show_text:'<gray>Click to run'><white>/xcore diag</hover></click> <gray>— Support report"
cmd-clear-cache: " <yellow>› <click:suggest_command:'/xcore clear-cache'><hover:show_text:'<gray>Click to fill in'><white>/xcore clear-cache</hover></click> <gray>— Empty every cache"

# ---------------------------------------------------------------------------
# /xcore stats
# ---------------------------------------------------------------------------

stats-header: " <aqua>Statistics"
stats-database: " <yellow>▸ <white>Database: <gray>{type} <white>· <gray>{reads} reads <white>· <gray>{writes} writes"
stats-l1-cache: " <yellow>▸ <white>L1 cache: <gray>{hit_rate}% <gray>hit rate <white>· <gray>{size} entries"
stats-redis: " <yellow>▸ <white>Redis: {status}"
stats-cross-server: " <yellow>▸ <white>Cross-server: {status}"
stats-mojang-api: " <yellow>▸ <white>Mojang API: <gray>{calls} <gray>calls <white>· <red>{failures} <gray>failures <white>· <gold>{rate_limits} <gray>rate limits"
stats-mojang-cache: " <yellow>▸ <white>Mojang cache: <green>{hits} <gray>hits <white>· <red>{misses} <gray>misses"
stats-skin-cache: " <yellow>▸ <white>Skin cache: <green>{hits} <gray>hits <white>· <red>{misses} <gray>misses"
stats-circuit-breaker: " <yellow>▸ <white>Circuit breaker: <gray>{state}"

# ---------------------------------------------------------------------------
# /xcore profile
# ---------------------------------------------------------------------------

profile-header: " <aqua>Profiling"
profile-disabled: " <yellow>▸ <white>Sampling is off. <gray>Turn it on with <white>/xcore profile on<gray>, or <white>profiling: true<gray> in config.yml."
profile-empty: " <yellow>▸ <white>Nothing measured yet. <gray>Give it a few minutes."
profile-window: " <yellow>▸ <white>Window: <gray>{seconds}s <white>· <gray>{keys} handlers measured"
profile-entry: " <yellow>▸ <white>{key} <dark_gray>│ <gray>{calls} calls <white>· <gray>{total} ms <white>· <gray>{avg} µs/call <white>· <gray>max {max} µs"
profile-hint: " <gray>Sorted by total time. The average is the cost of a single event: past 1000 µs, find out why."
profile-turned-on: " <yellow>▸ <white>Profiling <green>on<white>. <gray>Counters reset."
profile-turned-off: " <yellow>▸ <white>Profiling <red>off<white>."
profile-reset: " <yellow>▸ <white>Profiling counters reset."

# ---------------------------------------------------------------------------
# /xcore diag
# ---------------------------------------------------------------------------

diag-header: " <aqua>Diagnostic"
diag-platform: " <yellow>▸ <white>XCore <gray>v{version} <white>· <gray>{software} <white>· <gray>Java {java}"
diag-storage: " <yellow>▸ <white>Database: <gray>{type} <white>· <gray>{queries} connections <white>· <gray>{blocking} from a tick thread"
diag-addons: " <yellow>▸ <white>Addons: <gray>{enabled}/{count} enabled"
diag-written: " <yellow>▸ <white>Report written to <gray>plugins/XCore/{file}"
diag-failed: " <red>Could not write the report: <gray>{error}"

# ---------------------------------------------------------------------------
# /xcore addons
# ---------------------------------------------------------------------------

addons-header: " <aqua>Addons <yellow>({count})"
addons-empty: " <yellow>▸ <white>No addon installed. Drop their JARs in <gray>plugins/XCore/addons<white>."
addons-entry: " <yellow>▸ <green>{name} <yellow>v{version} <white>— {state}"
addon-state-enabled: "<green>enabled"
addon-state-loading: "<yellow>loading"
addon-state-disabled: "<gray>disabled"
addon-state-errored: "<red>errored"
addon-not-found: "<red>No addon named <white>{name}<red> is loaded."

# ---------------------------------------------------------------------------
# /xcore dashboard
# ---------------------------------------------------------------------------

dashboard-header: " <aqua>Web dashboard"
dashboard-status: " <yellow>▸ <white>Status: {status}"
dashboard-disabled: " <yellow>▸ <white>Set <gray>web-dashboard.enabled: true<white> in config.yml, then restart."
dashboard-failed: " <yellow>▸ <white>It is enabled but did not start, check the console."
dashboard-address: " <yellow>▸ <white>Address: <click:open_url:'{url}'><hover:show_text:'<gray>Click to open'><yellow><underlined>{url}</underlined></yellow></hover></click>"
dashboard-modules: " <yellow>▸ <white>Modules: <hover:show_text:'{list}'><gray>{count} registered</hover>"
dashboard-modules-none: "<gray>No module registered"
dashboard-login: " <yellow>▸ <white>Log in: <click:open_url:'{url}'><hover:show_text:'<green>Click to open the dashboard, already logged in'><green>[open the dashboard]</green></hover></click>"
dashboard-login-ttl: "   <yellow>· <white>The link logs you in for <gray>{hours}h<white>. Keep it to yourself."
dashboard-login-forever: "   <yellow>· <white>The link stays valid until you revoke it. Keep it to yourself."
dashboard-login-revoke: "   <yellow>· <white>Sent it to the wrong place? <click:run_command:'/xcore dashboard revoke'><hover:show_text:'<gray>Click to run'><gray>/xcore dashboard revoke</gray></hover></click>"
dashboard-login-console: " <yellow>▸ <white>Run <gray>/xcore dashboard<white> in game to get a login link. The console has no browser to open it with."
dashboard-revoked: "<green>Closed {count} dashboard session(s). The old links no longer work."
dashboard-revoked-none: "<red>You had no open dashboard session."

# ---------------------------------------------------------------------------
