# ---------------------------------------------------------------------------

reload-core: "<green>Reloaded successfully."
reload-addons: "<green>Reloaded {count} addon(s): <white>{list}"
reload-addons-none: "<red>No enabled addon to reload."
reload-addons-failed: "<red>Failed to reload: {list}. Check the console."
reload-restart-required: "<gray>Needs a restart to change: database, Redis, cache sizes, dashboard port."
reload-addon-success: "<green>Addon {name} reloaded."

# ---------------------------------------------------------------------------
# /xcore clear-cache
# ---------------------------------------------------------------------------

clear-cache-success: "<green>All caches cleared."

