# Fichier de langue XCore
# Format MiniMessage : https://docs.advntr.dev/minimessage/format.html
# Placeholders : {clé} est remplacé par la valeur correspondante.
#
# Mise en page : quelques libellés sont complétés par des espaces pour aligner les colonnes.
# Ajustez ce remplissage si vous rallongez un libellé.
#
# Attention aux arguments de hover et de click : leur texte est entouré de guillemets simples, donc
# une apostrophe à l'intérieur couperait la ligne. Écrivez « Cliquez pour ouvrir », jamais
# « Cliquez pour l'ouvrir ».

no-permission: "<red>Vous n'avez pas la permission d'utiliser cette commande."

# Éléments partagés
bar: "<white><strikethrough>                                                            </strikethrough>"
blank: ""
status-on: "<green>actif"
status-off: "<red>inactif"
player-online: "<green>en ligne"
player-offline: "<red>hors ligne"
value-none: "<gray>aucun"

# Unités de durée, collées au nombre : 2j 4h, 13m, 45s
unit-day: "j"
unit-hour: "h"
unit-minute: "m"
unit-second: "s"

# ---------------------------------------------------------------------------
# /xcore
# ---------------------------------------------------------------------------

info-header: " <aqua>XCore <yellow>v{version}"
info-subtitle: " <gray>Socle de l'écosystème X"

info-server: " <yellow>▸ <white>Serveur : <green>{name} <white>· <gray>{software}"
info-uptime: " <yellow>▸ <white>En ligne : <gray>{value} <white>· <green>{players}<white> connecté(s)"
info-database: " <yellow>▸ <white>Base : <gray>{type} <white>· <gray>{reads} lectures <white>· <gray>{writes} écritures"
info-addons: " <yellow>▸ <white>Addons : <hover:show_text:'{list}'><gray>{enabled}/{total}</hover>"
info-addons-entry: "<aqua>{name} <yellow>v{version} <white>— {state}"
info-addons-none: "<gray>Aucun addon installé"
info-sync: " <yellow>▸ <white>Sync : {status} <white>· <gray>{backend}"
sync-backend-redis: "Redis"
sync-backend-database: "interrogation BDD"
info-dashboard: " <yellow>▸ <white>Dashboard : <click:open_url:'{url}'><hover:show_text:'<gray>Cliquez pour ouvrir'><aqua><underlined>{url}</underlined></aqua></hover></click>"
info-dashboard-off: " <yellow>▸ <white>Dashboard <red>inactif <white>· <gray>activez-le dans config.yml"

info-commands: " <gray>Commandes"
cmd-stats: " <yellow>› <click:run_command:'/xcore stats'><hover:show_text:'<gray>Cliquez pour exécuter'><white>/xcore stats</hover></click> <gray>— Compteurs de cache et API"
cmd-addons: " <yellow>› <click:run_command:'/xcore addons'><hover:show_text:'<gray>Cliquez pour exécuter'><white>/xcore addons</hover></click> <gray>— Versions et états des addons"
cmd-player: " <yellow>› <click:suggest_command:'/xcore player '><hover:show_text:'<gray>Cliquez pour pré-remplir'><white>/xcore player <pseudo></hover></click> <gray>— Consulter un joueur"
cmd-dashboard: " <yellow>› <click:run_command:'/xcore dashboard'><hover:show_text:'<gray>Cliquez pour exécuter'><white>/xcore dashboard</hover></click> <gray>— Accès au dashboard web"
cmd-reload: " <yellow>› <click:suggest_command:'/xcore reload'><hover:show_text:'<gray>Cliquez pour pré-remplir'><white>/xcore reload [addon]</hover></click> <gray>— Recharger le cœur et les addons"
cmd-profile: " <yellow>› <click:run_command:'/xcore profile'><hover:show_text:'<gray>Cliquez pour exécuter'><white>/xcore profile</hover></click> <gray>— Temps passé par addon"
cmd-diag: " <yellow>› <click:run_command:'/xcore diag'><hover:show_text:'<gray>Cliquez pour exécuter'><white>/xcore diag</hover></click> <gray>— Rapport de diagnostic"
cmd-clear-cache: " <yellow>› <click:suggest_command:'/xcore clear-cache'><hover:show_text:'<gray>Cliquez pour pré-remplir'><white>/xcore clear-cache</hover></click> <gray>— Vider tous les caches"

