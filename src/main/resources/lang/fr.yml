# ---------------------------------------------------------------------------
# Économie (/eco)
#
# Ces clés vivaient dans economy_<code>.yml. Elles sont préfixées par eco- pour qu'un
# nouveau message du cœur ne puisse jamais en prendre la place.
# ---------------------------------------------------------------------------

player-only: "<red>Cette commande est réservée aux joueurs."
