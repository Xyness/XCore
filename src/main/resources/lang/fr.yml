eco-insufficient-funds: "<red>Fonds insuffisants. Vous avez {balance}."
error: "<red>Une erreur est survenue. Réessayez."
eco-balance-capped: "<yellow>Le solde a été plafonné à {max} pour {currency}."

eco-balance-title: "<aqua>Soldes"
eco-balance-self-single: "<white>Votre solde : <yellow>{balance} <gray>({currency})"
eco-balance-other-single: "<white>Solde de {name} : <yellow>{balance} <gray>({currency})"
eco-balance-entry: "  <yellow>{balance} <gray>({currency})"
eco-balance-end: ""

eco-pay-sent: "<green>Vous avez envoyé <yellow>{amount} <gray>({currency}) <green>à {target}."
eco-pay-received: "<green>Vous avez reçu <yellow>{amount} <gray>({currency}) <green>de {sender}."
eco-pay-self: "<red>Vous ne pouvez pas vous payer vous-même."

eco-set-success: "<green>Solde <gray>({currency}) <green>de {name} défini à <yellow>{amount}<green>."
eco-add-success: "<green>Ajout de <yellow>{amount} <gray>({currency}) <green>à {name}. Nouveau : <yellow>{balance}<green>."
eco-remove-success: "<green>Retrait de <yellow>{amount} <gray>({currency}) <green>à {name}. Nouveau : <yellow>{balance}<green>."
eco-reset-success: "<green>Solde <gray>({currency}) <green>de {name} réinitialisé à <yellow>{amount}<green>."

eco-resetall-warning: "<red>Ceci réinitialisera TOUS les joueurs (connectés et hors ligne) pour : {currency}. C'est irréversible."
eco-resetall-confirm-usage: "<red>Tapez <gray>/eco resetall {currency} confirm <red>pour confirmer."
eco-resetall-started: "<gray>Réinitialisation de tous les soldes pour {currency}..."
eco-resetall-success: "<green>{count} <green>solde(s) réinitialisé(s) pour {currency}."

eco-exchange-success: "<green>Vous avez échangé <yellow>{from_amount} <gray>({from_currency}) <green>contre <yellow>{to_amount} <gray>({to_currency})<green>."
eco-exchange-no-rate: "<red>Aucun taux de change disponible pour cette paire de monnaies."
eco-exchange-disabled: "<red>L'échange de monnaies est actuellement désactivé."

eco-history-title: "<aqua>Historique de {name} <gray>(Page {page}/{max_page})"
eco-history-entry: "  <gray>{date} <gray>| <green>{type} <gray>| <yellow>{amount} <gray>{currency} <gray>| <white>{target}"
eco-history-empty: "  <gray>Aucune transaction trouvée."
eco-history-end: ""

eco-top-title: "<aqua>Classement {currency}"
eco-top-entry: "  <white>#{rank} <gray>- <gold>{name} <gray>- <yellow>{balance}"
eco-top-empty: "  <gray>Aucune donnée disponible."
eco-top-end: ""

eco-reload-success: "<green>Configuration de l'économie rechargée."
eco-reload-warning-no-vault: "<yellow>Aucune monnaie n'est marquée <white>vault: true<yellow> — les autres plugins ne verront aucun solde."

eco-payout-received: "<green>Vous avez reçu <yellow>{amount} <gray>({currency}) <green>au titre du versement automatique."
eco-interest-received: "<green>Vous avez gagné <yellow>{amount} <gray>({currency}) <green>d'intérêts."

eco-help-message: |
  <aqua>Aide - Économie
  <gray>
  <yellow>/eco <white>- Voir tous vos soldes
  <yellow>/eco balance [joueur] [monnaie] <white>- Voir un solde
  <yellow>/eco pay <joueur> <montant> [monnaie] <white>- Envoyer de l'argent
  <yellow>/eco set <joueur> <montant> [monnaie] <white>- Définir un solde (admin)
  <yellow>/eco add <joueur> <montant> [monnaie] <white>- Ajouter à un solde (admin)
  <yellow>/eco remove <joueur> <montant> [monnaie] <white>- Retirer d'un solde (admin)
  <yellow>/eco reset <joueur> [monnaie|all] <white>- Remettre un joueur au solde de départ (admin)
  <yellow>/eco resetall [monnaie|all] confirm <white>- Réinitialiser tous les joueurs, connectés ou non (admin)
  <yellow>/eco exchange <de> <vers> <montant> <white>- Échanger des monnaies
  <yellow>/eco history [joueur] [monnaie] [page] <white>- Historique des transactions
  <yellow>/eco top [monnaie] <white>- Classement des soldes
  <yellow>/eco reload <white>- Recharger la configuration (admin)

