name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew clean shadowJar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCore
          path: build/libs/XCore-*.jar

# Releases are handled by release.yml, which triggers on tag pushes. This workflow only
# ever runs on branch pushes and pull requests, so a job gated on refs/tags/ here could
# never execute — it just showed up as a permanently "Skipped" check.
